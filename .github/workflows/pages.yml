name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/vigilant-faraday-ra54tq, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css calc.js i18n.js app.js quote.js pwa.js sw.js manifest.webmanifest _site/
          cp -r vendor icons _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
